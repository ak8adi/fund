[project]
name = "fundus"
version = "0.1.0"
description = "Private Gebrauchtwaren-Suche über Ricardo, Tutti, Anibis und eBay – mit ntfy-Benachrichtigung"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pyyaml>=6",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
fundus = "fundus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fundus*"]

[tool.setuptools.package-data]
fundus = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
