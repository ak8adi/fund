<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fundus{% endblock %}</title>
  <meta name="theme-color" content="#2f5d50">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%232f5d50' stroke-width='4'/%3E%3Cpath d='M21 21l7 7' stroke='%232f5d50' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v=3">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
  <header class="top">
    <a href="/" class="brand">fundus</a>
    <nav>
      <a href="/" {% if request.url.path != '/settings' %}class="here"{% endif %}>Suchen</a>
      <a href="/settings" {% if request.url.path == '/settings' %}class="here"{% endif %}>Einstellungen</a>
    </nav>
    {% if not ntfy_ok %}
    <a href="/settings" class="bell-off" title="Push-Benachrichtigungen sind aus – in den Einstellungen einrichten">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.73 21a2 2 0 0 1-3.46 0"></path><path d="M18.63 13A17.89 17.89 0 0 1 18 8"></path><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"></path><path d="M18 8a6 6 0 0 0-9.33-5"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </a>
    {% endif %}
    <div id="status" hx-get="/status" hx-trigger="every 4s" hx-swap="innerHTML" >
      {% include "_status.html" %}
    </div>
  </header>
  <main class="intro">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Einblend-Animation nur beim ersten Laden, nicht bei jedem Auto-Refresh
    setTimeout(() => document.querySelector('main').classList.remove('intro'), 1200);
    // Menüs schliessen beim Klick daneben
    document.addEventListener('click', e => document.querySelectorAll('details.menu[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }));
  </script>
</body>
</html>
