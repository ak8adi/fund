{% set s = search if search is defined else none %}
<form method="post" action="{{ '/search/%d' % s.id if s else '/searches' }}" class="search-form">
  <div class="row">
    <label class="grow">Suchbegriff
      <input name="query" required placeholder="z.B. kite 9m, eames chair, fujifilm x100" value="{{ s.query if s else '' }}">
    </label>
  </div>
  <div class="row">
    <label>Preis min (CHF)<input name="min_price" inputmode="decimal" value="{{ s.min_price | int if s and s.min_price is not none else '' }}"></label>
    <label>Preis max (CHF)<input name="max_price" inputmode="decimal" value="{{ s.max_price | int if s and s.max_price is not none else '' }}"></label>
    <label class="grow">Ausschliessen (kommagetrennt)
      <input name="exclude" placeholder="defekt, kinder, suche" value="{{ s.exclude if s else '' }}">
    </label>
  </div>
  <fieldset class="row platforms">
    <legend>Plattformen <span class="muted small">(nichts angehakt = alle eingeschalteten)</span></legend>
    {% for name, label in adapters %}
      <label class="check"><input type="checkbox" name="platforms" value="{{ name }}"
        {% if s and s.platforms and name in s.platforms %}checked{% endif %}> {{ label }}</label>
    {% endfor %}
  </fieldset>
  <button class="btn">{{ 'Speichern' if s else 'Suche anlegen' }}</button>
</form>
