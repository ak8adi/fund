{% if running %}
  <span class="pill busy">Prüft gerade …</span>
{% else %}
  <form hx-post="/run" hx-target="#status" hx-swap="innerHTML" method="post" action="/run" class="inline">
    <button class="btn small">Alle jetzt prüfen</button>
  </form>
  <span class="muted small">
    {% if runs %}zuletzt {{ runs[0].started_at | ago }}{% if runs[0].new_hits %} · {{ runs[0].new_hits }} neu{% endif %}{% endif %}
    {% if next_runs %} · nächster {{ next_runs[0] | clock }}{% endif %}
  </span>
{% endif %}
